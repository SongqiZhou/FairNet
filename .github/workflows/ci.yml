name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # transformers 4 and 5 place ViT and DistilBERT attention modules under
        # different paths, so both majors are exercised.
        python-version: ["3.10", "3.12"]
        transformers: ["<5", ">=5"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU PyTorch
        run: >-
          python -m pip install torch torchvision
          --index-url https://download.pytorch.org/whl/cpu
      - name: Install package and test tools
        run: python -m pip install -e ".[test]"
      - name: Pin transformers major version
        run: python -m pip install "transformers${{ matrix.transformers }}"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir wheelhouse .
