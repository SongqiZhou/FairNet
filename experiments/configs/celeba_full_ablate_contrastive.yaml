# Supplementary Table C: the contrastive-loss ablation in the full-label
# setting, where the detector is unnecessary because groups are known.
base: celeba_full
fairnet:
  stage4_objective: task
  # Section 5.4 says the ablation replaces the contrastive loss with "binary
  # cross entropy loss on flagged instances", i.e. plain BCE. Class-balancing it
  # would turn the ablation into a strong method in its own right rather than a
  # weaker baseline rather than a method in its own right.
  class_balanced_stage4_task: false
