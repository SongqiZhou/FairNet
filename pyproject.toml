[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fairnet-cc-lora"
version = "1.1.0"
description = "Dynamic fairness correction with contrastive conditional LoRA"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
authors = [
  {name = "Songqi Zhou", email = "zhousongqi@tsinghua.edu.cn"},
  {name = "Zeyuan Liu"},
  {name = "Benben Jiang"},
]
keywords = ["fairness", "lora", "transformers", "deep-learning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=9",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "torchvision>=0.16",
  "tqdm>=4.65",
  "transformers>=4.40",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.9"]
# Extras needed only to run the paper-reproduction scripts under experiments/.
experiments = [
  "PyYAML>=6",
  "datasets>=2.18",
  "huggingface_hub>=0.23",
  "pyarrow>=14",
]

[project.urls]
Homepage = "https://github.com/SongqiZhou/FairNet"
Paper = "https://doi.org/10.52202/085713-3013"
Issues = "https://github.com/SongqiZhou/FairNet/issues"

[tool.setuptools.packages.find]
include = ["fairnet*", "scr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
